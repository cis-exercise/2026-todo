{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-auto">
        <div class="row">
            <div class="col-auto">
                <h1>{{ title }}</h1>
            </div>
        </div>
        <form action="/login" method="post">
            <div class="row">
                <div class="col-auto">
                    <div class="form-floating">
                        <input class="form-control" type="text" name="id" id="id" placeholder="ユーザIDを入力..." required>
                        <label for="id" class="col-form-label">ユーザID</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-auto">
                    <div class="form-floating">
                        <input class="form-control" type="password" name="password" id="password" placeholder="パスワードを入力..." required>
                        <label for="password" class="col-form-label">パスワード</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-auto">
                    <input class="btn btn-primary" type="submit" value="ログイン">
                    <a href="/register">新規ユーザ登録</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
